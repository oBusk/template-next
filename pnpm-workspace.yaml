allowBuilds:
    "@parcel/watcher": true
    sharp: true
    simple-git-hooks: true
    unrs-resolver: true

configDependencies:
    "@obusk/pnpm-plugin-defaults": 12.14.1

minimumReleaseAgeExclude:
    - next
    - "@next/*"
    - eslint-config-next
    - "@obusk/eslint-config-next"
    - "@obusk/pnpm-plugin-defaults"

overrides:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0

trustPolicyExclude:
    - eslint-import-resolver-typescript@3.10.1
    - semver@6.3.1
